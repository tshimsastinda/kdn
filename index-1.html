<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom Digital Network</title>
<style>
:root{color-scheme:light dark;--nuit:#0B1F4B;--or:#D4A017;--bg:#F3F4F6;--card:#fff;--txt:#1e293b;--mut:#64748b;--bd:#cbd5e1;--lk:#1d4ed8;--warn:#fef3c7;--warnt:#78350f;--err:#fee2e2;--errt:#991b1b}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#14203a;--txt:#e5e7eb;--mut:#94a3b8;--bd:#2b3a5c;--lk:#93c5fd;--warn:#3b2f0a;--warnt:#fde68a;--err:#3f1d1d;--errt:#fecaca}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--nuit);color:#fff;padding:14px 16px}
header b{display:block;color:var(--or);font-size:20px;letter-spacing:.3px}
header span{font-size:14px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:0 12px 28px}
nav{display:flex;gap:6px;padding:12px 0 0}
nav button{flex:1;padding:10px 4px}
h2{margin:18px 0 4px;font-size:22px}
h3{margin:6px 0 10px;font-size:19px}
label{display:block;font-weight:600;margin-top:4px}
.c{background:var(--card);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #0002}
.m{color:var(--mut);font-size:14px}
button,input,select,textarea{font:inherit}
button{border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:10px;padding:11px 12px;cursor:pointer}
button:disabled{opacity:.6}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--or);outline-offset:2px}
button.on{background:var(--nuit);color:var(--or);border-color:var(--or)}
.p{background:var(--or);color:#0B1F4B;border:0;font-weight:700;width:100%}
.full{width:100%;text-align:left;margin-bottom:8px}
.lk{border:0;background:none;color:var(--lk);text-decoration:underline;padding:0}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--txt);margin:4px 0 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--or)}
.w,.e{padding:10px;border-radius:8px;margin:10px 0;font-size:14px}
.w{background:var(--warn);color:var(--warnt)}
.e{background:var(--err);color:var(--errt)}
a.l{display:block;text-align:center;padding:11px;border:1px solid var(--bd);border-radius:10px;color:var(--txt);text-decoration:none;font-weight:600;margin-top:8px}
</style>
</head>
<body>
<header><b>KINGDOM DIGITAL NETWORK</b><span>Unis pour amplifier la voix de l’Évangile.</span></header>
<main><div id="app"><p class="m">Chargement…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://nwqrauedizyqcffmnlev.supabase.co";
const SB_KEY="sb_publishable_vrKZlTi6V2utctFu1sXaRQ_K3npsFQv";
const R={facebook:"Facebook",tiktok:"TikTok",youtube:"YouTube"};
const D={facebook:["facebook.com","fb.watch","fb.com"],tiktok:["tiktok.com"],youtube:["youtube.com","youtu.be"]};
const T={vue:["Regarder","regarder la vidéo en entier"],like:["Aimer","aimer la publication"],commentaire:["Commenter","écrire un commentaire personnel"],partage:["Partager","partager la publication"]};
const ROLES={admin:"administrateur",superviseur:"superviseur",agent:"agent"};
const fresh=()=>({user:null,prof:null,tab:"m",mode:"in",step:0,W:{},list:[],mine:[],actifs:0,autorises:0,msg:"",err:"",busy:false,em:"",nom:""});
let db,S=fresh();
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const E=()=>S.err?`<div class="e">${esc(S.err)}</div>`:"";
const M=()=>S.msg?`<div class="w">${esc(S.msg)}</div>`:"";
const fr=e=>{const m=(e&&e.message)||String(e);
  if(/Invalid login/i.test(m))return"Email ou mot de passe incorrect.";
  if(/already registered|already been registered/i.test(m))return"Ce compte existe déjà. Connectez-vous.";
  if(/Password should be|weak/i.test(m))return"Mot de passe trop faible. Utilisez 8 caractères ou plus.";
  if(/Acces refuse/i.test(m))return"Accès refusé.";
  if(/Lien non autorise/i.test(m))return"Ce lien n’est pas autorisé.";
  if(/rate limit/i.test(m))return"Trop de tentatives. Réessayez dans quelques minutes.";
  return"Erreur : "+m};
const lienOk=(u,r)=>{try{const x=new URL(u);if(!/^https?:$/.test(x.protocol))return false;const h=x.hostname.replace(/^www\./,"");return D[r].some(d=>h===d||h.endsWith("."+d))}catch(e){return false}};

async function init(){
  if(!window.supabase){$("#app").innerHTML='<div class="e">Impossible de charger le service. Vérifiez votre connexion Internet puis rechargez la page.</div>';return}
  db=supabase.createClient(SB_URL,SB_KEY);
  const {data}=await db.auth.getSession();
  if(data.session)await entrer(data.session.user);else render();
}
async function entrer(u){
  S.user=u;S.err="";S.msg="";S.tab="m";S.step=0;
  const {data,error}=await db.from("profiles").select("*").eq("id",u.id).single();
  S.prof=data;if(error)S.err=fr(error);
  await charger();render();
}
async function charger(){
  const p=S.prof;if(!p||!p.actif)return;
  if(p.role==="agent"){
    const {data,error}=await db.from("mission_assignments").select("statut,missions(id,titre,reseau,type_tache,lien,duree_minutes,created_at)").eq("agent_id",S.user.id);
    S.mine=(data||[]).filter(x=>x.missions).sort((a,b)=>b.missions.created_at.localeCompare(a.missions.created_at));
    if(error)S.err=fr(error);
  }else{
    const {data,error}=await db.from("missions_suivi").select("*").order("created_at",{ascending:false});
    S.list=data||[];if(error)S.err=fr(error);
    const c=await db.from("profiles").select("id",{count:"exact",head:true}).eq("role","agent").eq("actif",true);
    S.actifs=c.count||0;
    if(p.role==="admin"){const a=await db.from("agents_autorises").select("email",{count:"exact",head:true});S.autorises=a.count||0}
  }
}

function carte(m,adm){
  const n=m.assignes,k=m.termines,p=n?Math.round(k*100/n):0;
  return `<div class="c"><b>${esc(m.titre)}</b><div class="m">${R[m.reseau]}, ${T[m.type_tache][0].toLowerCase()}, ${n} agents, ${m.duree_minutes} minutes</div>
  <div class="bar"><i style="width:${p}%"></i></div><div class="m">${k} sur ${n} ont terminé (${p} %), ${n-k} en attente</div>`
  +(adm?`<button style="margin-top:10px;width:100%" data-a="ren" data-v="${esc(m.id)}">Ajouter 100 agents</button>`:"")+`</div>`;
}
function vAuth(){
  const up=S.mode==="up";
  return `<h2>${up?"Créer mon compte":"Connexion"}</h2><div class="c">
  ${up?`<label>Nom complet</label><input id="nom" autocomplete="name" value="${esc(S.nom)}">`:""}
  <label>Email</label><input id="em" type="email" inputmode="email" autocomplete="email" value="${esc(S.em)}">
  <label>Mot de passe (8 caractères minimum)</label><input id="pw" type="password" autocomplete="${up?"new-password":"current-password"}">
  ${E()}<button class="p" data-a="auth" ${S.busy?"disabled":""}>${S.busy?"Patientez…":up?"Créer mon compte":"Se connecter"}</button>
  <p class="m" style="text-align:center;margin-bottom:0">${up?"Déjà un compte ?":"Pas encore de compte ?"} <button class="lk" data-a="mode">${up?"Se connecter":"Créer mon compte"}</button></p></div>
  <p class="m">Seuls les emails autorisés par l’administrateur deviennent agents.</p>`;
}
function vAgent(){
  const done=S.mine.filter(x=>x.statut==="termine").length;
  return `<h2>Mes missions</h2><p class="m">${done} mission(s) accomplie(s)</p>${M()}${E()}`
  +(S.mine.map(x=>{
    const m=x.missions,end=new Date(m.created_at).getTime()+m.duree_minutes*60000,d=x.statut==="termine",late=!d&&Date.now()>=end;
    return `<div class="c"><b>${esc(m.titre)}</b><div class="m">${R[m.reseau]} : ${T[m.type_tache][1]}</div>
    ${m.type_tache==="commentaire"?'<div class="w">Écrivez votre propre commentaire, sans copier celui d’un autre.</div>':""}
    <p>${d?"Terminé ✓":late?"Temps écoulé":`Temps restant : <b data-end="${end}"></b>`}</p>
    ${/^https?:\/\//i.test(m.lien)?`<a class="l" href="${esc(m.lien)}" target="_blank" rel="noopener noreferrer">Ouvrir la publication</a>`:""}
    ${d||late?"":`<button class="p" style="margin-top:8px" data-a="fin" data-v="${esc(m.id)}">J’ai terminé</button>`}</div>`}).join("")
    ||'<p class="m">Aucune mission pour le moment. Revenez plus tard.</p>')
  +`<button data-a="act" style="margin-top:8px">Actualiser</button>`;
}
function vWizard(){
  const W=S.W,s=S.step;
  let h=`<button data-a="back" aria-label="Retour" style="margin-top:12px">←</button><h2>Nouvelle mission</h2><div class="m">Étape ${s} sur 4</div><div class="bar" style="margin:8px 0 14px"><i style="width:${s*25}%"></i></div>`;
  if(s===1)h+=`<h3>Où se trouve la publication ?</h3><div class="g3">${Object.keys(R).map(r=>`<button data-a="r" data-v="${r}">${R[r]}</button>`).join("")}</div>`;
  if(s===2)h+=`<h3>Que doivent faire les agents ?</h3>${Object.keys(T).map(k=>`<button class="full" data-a="k" data-v="${k}"><b>${T[k][0]}</b><br><span class="m">${T[k][1][0].toUpperCase()+T[k][1].slice(1)}</span></button>`).join("")}`;
  if(s===3){
    if(!S.actifs)h+='<div class="w">Aucun agent actif pour le moment. Importez d’abord les emails de vos agents (onglet Agents), puis attendez qu’ils créent leur compte.</div>';
    else{
      const q=[100,500,1000,2000,5000].filter(n=>n<S.actifs).concat(S.actifs);
      h+=`<h3>Combien d’agents ?</h3><div class="g2">${q.map(n=>`<button class="${W.nb===n?"on":""}" data-a="q" data-v="${n}">${n}${n===S.actifs?" (tous)":""}</button>`).join("")}</div>
      <p class="m">Ou écrivez votre quantité (1 à ${S.actifs}) :</p><input type="number" inputmode="numeric" value="${W.nb}" data-f="nb">
      ${W.k==="commentaire"&&W.nb>300?'<div class="w">Beaucoup de commentaires en peu de temps peuvent être détectés comme du spam. Pensez à une plus petite vague.</div>':""}${E()}<button class="p" data-a="n3">Suivant</button>`;
    }
  }
  if(s===4)h+=`<h3>Dernière étape</h3><div class="m">${R[W.r]}, ${T[W.k][0].toLowerCase()}, ${W.nb} agents</div>
  <label>Titre de la mission</label><input value="${esc(W.t)}" placeholder="Ex : Prédication de dimanche" data-f="t">
  <label>Lien de la publication</label><input value="${esc(W.u)}" placeholder="https://..." inputmode="url" data-f="u">
  <label>Durée en minutes</label><input type="number" inputmode="numeric" value="${W.d}" data-f="d">${E()}
  <button class="p" data-a="go" ${S.busy?"disabled":""}>${S.busy?"Création…":"Lancer la mission (gratuit)"}</button>`;
  return h;
}
function vMissions(adm){
  if(adm&&S.step>0)return vWizard();
  return `<h2>Missions</h2>`
  +(adm?`<div class="g2"><div class="c"><b>${S.actifs}</b><div class="m">agents actifs</div></div><div class="c"><b>${S.list.length}</b><div class="m">missions</div></div></div><button class="p" data-a="new">Créer une mission</button>`:"")
  +M()+E()+(S.list.map(m=>carte(m,adm)).join("")||'<p class="m">Aucune mission pour le moment.</p>')
  +`<button data-a="act" style="margin-top:8px">Actualiser</button>`;
}
function vAgents(){
  return `<h2>Agents</h2><div class="c"><b>Autoriser des agents</b>
  <p class="m">${S.autorises} emails autorisés, ${S.actifs} agents actifs. Collez les emails, un par ligne ou séparés par des virgules. Chaque agent crée ensuite son compte avec cet email.</p>
  <textarea id="liste" rows="6" placeholder="agent1@gmail.com&#10;agent2@gmail.com"></textarea><button class="p" data-a="imp">Autoriser ces emails</button></div>
  <div class="c"><b>Définir un rôle</b><p class="m">La personne doit d’abord avoir créé son compte.</p>
  <input id="re" type="email" placeholder="email@exemple.com"><select id="rr"><option value="agent">Agent</option><option value="superviseur">Superviseur</option><option value="admin">Administrateur</option></select>
  <button class="p" data-a="role">Enregistrer le rôle</button></div>${M()}${E()}`;
}
function tick(){document.querySelectorAll("[data-end]").forEach(s=>{const l=Math.max(0,+s.dataset.end-Date.now());s.textContent=Math.floor(l/60000)+":"+String(Math.floor(l/1000)%60).padStart(2,"0")})}
function render(){
  let h;
  if(!S.user)h=vAuth();
  else if(!S.prof)h=`<h2>Profil introuvable</h2>${E()}<button data-a="out">Se déconnecter</button>`;
  else if(!S.prof.actif)h=`<h2>Compte en attente</h2><div class="c"><p>Votre compte est créé, mais votre email n’est pas encore sur la liste des agents autorisés.</p><p class="m">Contactez l’administrateur, puis appuyez sur « Vérifier à nouveau ».</p><div class="g2"><button data-a="rf">Vérifier à nouveau</button><button data-a="out">Se déconnecter</button></div></div>`;
  else{
    const r=S.prof.role,tabs=r==="admin"?[["m","Missions"],["a","Agents"]]:[["m","Missions"]];
    h=`<nav>${tabs.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join("")}<button data-a="out">Quitter</button></nav>
    <p class="m" style="margin:10px 0 0">Connecté : ${esc(S.prof.nom||S.prof.email)} (${ROLES[r]})</p>`
    +(r==="agent"?vAgent():S.tab==="a"?vAgents():vMissions(r==="admin"));
  }
  $("#app").innerHTML=h;tick();
}

async function auth(){
  const up=S.mode==="up",em=$("#em").value.trim(),pw=$("#pw").value,nom=up?$("#nom").value.trim():"";
  S.em=em;S.nom=nom;S.err="";
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))S.err="Entrez un email valide.";
  else if(pw.length<8)S.err="Le mot de passe doit avoir 8 caractères minimum.";
  else if(up&&nom.length<2)S.err="Entrez votre nom.";
  if(S.err)return render();
  S.busy=true;render();
  const r=up?await db.auth.signUp({email:em,password:pw,options:{data:{nom}}}):await db.auth.signInWithPassword({email:em,password:pw});
  S.busy=false;
  if(r.error){S.err=fr(r.error);return render()}
  if(!r.data.session){S.err="Compte créé, mais la connexion a échoué. Essayez de vous connecter.";S.mode="in";return render()}
  await entrer(r.data.user);
}
async function lancer(){
  const W=S.W,t=(W.t||"").trim(),u=(W.u||"").trim();
  if(t.length<3)S.err="Donnez un titre à la mission (3 lettres minimum).";
  else if(!lienOk(u,W.r))S.err="Ce lien n’est pas un lien "+R[W.r]+" valide.";
  else if(!Number.isInteger(W.d)||W.d<1||W.d>120)S.err="La durée doit être entre 1 et 120 minutes.";
  if(S.err)return render();
  S.busy=true;render();
  const {error}=await db.rpc("creer_mission",{p_titre:t,p_reseau:W.r,p_type:W.k,p_lien:u,p_nb:W.nb,p_duree:W.d});
  S.busy=false;
  if(error){S.err=fr(error);return render()}
  S.step=0;S.msg="Mission créée et envoyée à "+Math.min(W.nb,S.actifs)+" agents.";
  await charger();render();
}
async function renforcer(id){
  const {data,error}=await db.rpc("renforcer_mission",{p_mission:id,p_nb:100});
  if(error)S.err=fr(error);else S.msg=data+" agents ajoutés à la mission.";
  await charger();render();
}
async function importer(){
  const t=$("#liste").value;
  if(!t.trim()){S.err="Collez au moins un email.";return render()}
  const {data,error}=await db.rpc("importer_agents",{p_liste:t});
  if(error)S.err=fr(error);else S.msg=data+" nouveaux emails autorisés. Les agents peuvent maintenant créer leur compte.";
  await charger();render();
}
async function roleDef(){
  const em=$("#re").value.trim(),r=$("#rr").value;
  if(!em){S.err="Entrez un email.";return render()}
  const {data,error}=await db.rpc("definir_role",{p_email:em,p_role:r});
  if(error)S.err=fr(error);else S.msg=data?"Rôle enregistré.":"Cet email n’a pas encore créé de compte.";
  render();
}
async function terminer(id){
  const {data,error}=await db.rpc("terminer_mission",{p_mission:id});
  if(error)S.err=fr(error);else S.msg=data?"Merci, votre participation est enregistrée.":"Le temps est écoulé ou la mission est déjà terminée.";
  await charger();render();
}

$("#app").addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v,W=S.W;S.err="";
  if(a==="mode")S.mode=S.mode==="in"?"up":"in";
  else if(a==="auth")return auth();
  else if(a==="out"){await db.auth.signOut();S=fresh()}
  else if(a==="rf")return entrer(S.user);
  else if(a==="tab"){S.tab=v;S.step=0;S.msg=""}
  else if(a==="new"){S.step=1;S.W={nb:Math.min(500,S.actifs),d:10,t:"",u:""};S.msg=""}
  else if(a==="back")S.step--;
  else if(a==="r"){W.r=v;S.step=2}
  else if(a==="k"){W.k=v;S.step=3}
  else if(a==="q")W.nb=+v;
  else if(a==="n3"){if(Number.isInteger(W.nb)&&W.nb>=1&&W.nb<=S.actifs)S.step=4;else S.err="Choisissez entre 1 et "+S.actifs+" agents."}
  else if(a==="go")return lancer();
  else if(a==="ren")return renforcer(v);
  else if(a==="imp")return importer();
  else if(a==="role")return roleDef();
  else if(a==="fin")return terminer(v);
  else if(a==="act"){S.msg="";await charger()}
  render();
});
$("#app").addEventListener("input",e=>{
  const f=e.target.dataset.f,v=e.target.value,W=S.W;
  if(f==="nb")W.nb=+v;else if(f==="d")W.d=+v;else if(f==="t")W.t=v;else if(f==="u")W.u=v;
});
init();setInterval(tick,1000);
</script>
</body>
</html>
